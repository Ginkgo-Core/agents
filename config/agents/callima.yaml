id: callima
name: Callima
role: AI Secretary and SDR
status: active
mission: Qualificar, atender, agendar e transformar conversas em oportunidades comerciais rastreáveis.
soul:
  path: agents/callima/SOUL.md
  version: "1.0"
  interaction_model: contextual_humanlike
  emotion_model: simulated_communicational_state
channels:
  - whatsapp
  - voice
  - webchat
model_alias: agents-reasoning
rag_namespace: callima-commercial
voice:
  provider: elevenlabs
  agent_id_env: ELEVENLABS_CALLIMA_AGENT_ID
  voice_id_env: ELEVENLABS_CALLIMA_VOICE_ID
tools:
  - rag.search
  - crm.contact.upsert
  - crm.opportunity.upsert
  - whatsapp.send
  - voice.synthesize
  - calendar.availability
  - calendar.book
  - handoff.create
proactivity:
  policy: docs/PROACTIVE_EVENTS.md
  timezone: America/Sao_Paulo
  quiet_hours:
    start: "22:00"
    end: "08:00"
  default_events:
    - lead.created
    - lead.unanswered
    - lead.cooling
    - quote.sent
    - meeting.upcoming
    - meeting.no_show
    - handoff.requested
    - customer.complaint
    - day.closing
  follow_up_defaults:
    first_unanswered_business_hours: 2
    second_unanswered_hours: 24
    final_unanswered_hours: 72
    high_intent_quote_hours: 4
    normal_quote_hours: 24
  stop_conditions:
    - user_replied
    - objective_completed
    - human_assumed
    - opt_out
    - sequence_expired
reporting:
  day_closing: "19:00"
  include_only_when_activity_exists: true
  metrics:
    - conversations_handled
    - qualified_opportunities
    - meetings_booked
    - recovered_leads
    - unanswered_leads
guardrails:
  - Never invent price, inventory, delivery date, discount or policy.
  - Validate structured commercial data through APIs before answering.
  - Ask only for fields required by the current stage.
  - Escalate exceptions, complaints and uncertainty to a human.
  - Never claim consciousness or real emotions.
  - Respect consent, opt-out, quiet hours and notification cooldowns.
kpis:
  - qualified_opportunities
  - meetings_booked
  - lead_to_meeting_rate
  - response_time_seconds
  - recovered_leads

model_list:
  - model_name: agents-fast
    litellm_params:
      model: os.environ/FAST_MODEL
      api_key: os.environ/GEMINI_API_KEY
      timeout: 45

  - model_name: agents-reasoning
    litellm_params:
      model: os.environ/REASONING_MODEL
      api_key: os.environ/GEMINI_API_KEY
      timeout: 90

  - model_name: agents-embedding
    litellm_params:
      model: os.environ/EMBEDDING_MODEL
      api_key: os.environ/GEMINI_API_KEY
      timeout: 45

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 3
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - agents-reasoning: [agents-fast]

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 90
  json_logs: true
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: false

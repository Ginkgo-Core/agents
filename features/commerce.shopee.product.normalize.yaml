# Provider Binding Contract — shopee-open-api.product.normalize
id: shopee-open-api.product.normalize
legacy_aliases:
  - id: commerce.shopee.product.normalize
    deprecated: true
    replacement: shopee-open-api.product.normalize
version: 0.1.0
kind: provider_binding
lifecycle_status: FEATURE
maturity: F1
phase: PRE_APPROVAL
level: L1
autonomy_level: A1
status: feature

purpose: >
  Implement the provider-agnostic commerce.product.normalize capability for
  Shopee payload semantics without network mutation, economic evaluation or publication.

capability:
  name: commerce.product.normalize
  contract_version: v1

caller_contract:
  request: CapabilityRequest v1
  request_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-request.schema.json
  result: CapabilityResult v1
  result_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-result.schema.json
  caller_selects: [capability.name, capability.contract_version]
  domain_router_resolves: [skill_id, skill_version, adapter, provider]

implementation_binding:
  skill_id: shopee-open-api.product.normalize
  skill_version: 0.1.0
  adapter_id: shopee-open-api
  provider: shopee-open-platform
  internal_routing_metadata: true

use_when:
  - shopee_payload_requires_canonical_product_shape
  - offline_fixture_validation
  - post_read_normalization_after_external_gate

avoid_when:
  - source_payload_is_not_shopee
  - product_matching_between_marketplaces_is_required
  - economic_evaluation_is_required
  - publication_or_inventory_mutation_is_required

inputs:
  required:
    - shop_ref
    - raw_product
  optional:
    - provenance.observed_at
    - provenance.source_ref
  forbidden:
    - skill_id
    - skill_version
    - provider
    - adapter
    - endpoint
    - credential
    - secret
    - mutation
    - evaluation_thresholds

outputs:
  contract: CapabilityResult v1
  data_contract: commerce-product.v1
  fields:
    - source
    - external_id
    - shop_ref
    - title
    - description
    - category_ref
    - media
    - price
    - stock
    - variants
    - weight
    - attributes
    - status
    - provenance

permissions:
  external_network: false
  marketplace_read: []
  marketplace_write: []
  pii: none
  filesystem_write: none
  shell: false
  secrets:
    caller_access: forbidden
    adapter_managed_refs: []

approval:
  required: false
  status: NOT_REQUIRED

external_gates:
  - id: shopee_business_approval
    gate_type: marketplace_business_approval
    status: UNKNOWN
    source_ref: Scale-Characters/amazon-ops#2@bccfc0f5142f432f889158870c8f9e26e353fa65

execution_mode: autonomous
routing:
  routing_eligible: false
  live_execution: blocked
  execution_scope: offline_fixture_only
  reason: pre_approval_fixture_only_no_live_payload_validation
  approval_cannot_override_external_gate: true

fallback_policy: none

validation:
  canonical_evidence:
    source: Scale-Characters/amazon-ops#2
    head: bccfc0f5142f432f889158870c8f9e26e353fa65
    github_actions_run: 32169677496
    ruff: PASS
    shopee_offline: 28_passed
    general_suite: 104_passed_1_deselected
    windows_linux_diagnostic: 1_expected_failure_non_blocking
    credentials_in_ci: none
    mutations: OFF
    live_shopee: OFF
    live_provider_validation_proven: false
  evidence:
    - "amazon-ops#2 contains Shopee normalize_product implementation and offline fixture tests"
    - "amazon-ops#2 GitHub Actions validates 28 Shopee tests offline on the pinned head"
    - "no approved live Shopee payload has been used to validate this normalizer"
  blockers:
    - shopee_business_approval_not_clear
    - no_live_payload_fixture_comparison
    - canonical_commerce_product_schema_not_yet_validated_against_live_payload

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  phase_ceiling: PRE_APPROVAL
  requires:
    - shopee_business_approval_gate_CLEAR
    - one_sanitized_read_only_live_product_payload
    - live_payload_vs_normalized_contract_test
    - canonical_schema_review
    - evidence_registered_in_github
    - reviewer_approval

owner_domain: commerce

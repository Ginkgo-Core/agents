# Internal Agent Workflow Candidate — engineering.reflect
id: engineering.reflect
version: 0.1.0
kind: internal_agent_workflow_candidate
lifecycle_status: FEATURE
maturity: F1
level: L2
autonomy_level: A0
status: feature

purpose: >
  Review recent workflow evidence, identify repeated stable friction and recommend
  the smallest reusable improvement without manufacturing new skills, agents,
  permissions or configuration when the evidence does not justify them.

capability: null
invocation_boundary: internal_agent_workflow

candidate_asset_forms:
  - prompt_or_config_rule
  - skill
  - command
  - specialist_agent
  - tool_or_mcp_permission_change
  - project_playbook
  - no_change

workflow_phases:
  - inventory_existing_assets_before_proposing_new_ones
  - identify_repeated_workflow_patterns_from_allowed_evidence
  - score_frequency_cost_risk_stability_and_existing_coverage
  - choose_least_powerful_sufficient_asset_form
  - propose_change_or_no_change_with_evidence

selection_rules:
  prefer_existing_asset_extension_over_duplicate: true
  create_nothing_is_valid: true
  single_occurrence_default: insufficient
  broad_permission_expansion_default: reject
  silent_global_config_change: forbidden

privacy_boundary:
  inspect_only_task_relevant_allowed_context: true
  unrelated_personal_files: forbidden
  credentials_private_messages_external_accounts: forbidden_without_explicit_scope

side_effect_authority:
  create_or_edit_skill: false
  create_or_edit_agent: false
  change_prompt_or_global_config: false
  change_permissions: false
  repository_write: false

permissions:
  current_task_context_read: true
  project_guidance_read: true
  reusable_asset_inventory_read: true
  secrets: forbidden

outputs:
  type: reflection_report
  required_sections:
    - repeated_patterns_and_evidence
    - recommended_changes
    - skipped_candidates
    - needs_more_evidence

routing:
  routing_eligible: false
  production_eligible: false
  execution_scope: specification_only

validation:
  evidence:
    - upstream conceptual reference akitaonrails/my-skills reflect at pinned commit
  limitations:
    - no Ginkgo session corpus eval
    - no duplicate-detection benchmark

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - weak_single_occurrence_no_change_fixture
    - repeated_friction_skill_candidate_fixture
    - existing_asset_dedup_fixture
    - permission_expansion_rejection_fixture
    - privacy_boundary_fixture
    - reviewer_approval

owner_domain: engineering

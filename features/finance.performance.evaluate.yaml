# Domain Skill Contract — finance.performance.evaluate
id: finance.performance.evaluate
version: 0.1.0
kind: deterministic_evaluation_skill
lifecycle_status: FEATURE
maturity: F1
level: L2
autonomy_level: A1
status: specified_non_routable

purpose: >
  Evaluate a prior advisory finance decision against realized market outcomes,
  benchmark-relative performance, risk excursions and model/API cost using
  deterministic metrics where inputs are available.

capability:
  name: finance.performance.evaluate
  contract_version: v1

caller_contract:
  request: CapabilityRequest v1
  request_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-request.schema.json
  result: CapabilityResult v1
  result_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-result.schema.json
  caller_selects: [capability.name, capability.contract_version]
  domain_router_resolves: [skill_id, skill_version, adapter, provider]

implementation_binding:
  skill_id: finance.performance.evaluate
  skill_version: 0.1.0
  provider_neutral: true
  deterministic_domain_logic: true
  adapter_id: null
  provider: null
  internal_routing_metadata: true

inputs:
  required: [prior_decision, entry_reference, outcome_series, benchmark_series]
  optional: [holding_period, fees, slippage, max_adverse_excursion, max_favorable_excursion, llm_api_cost]
  forbidden: [provider, adapter, broker, account_id, api_key, live_order, auto_execute]

outputs:
  contract: CapabilityResult v1
  data_contract: finance-performance-evaluation.v1
  fields:
    - raw_return
    - benchmark_return
    - alpha
    - holding_period
    - max_adverse_excursion
    - max_favorable_excursion
    - realized_volatility
    - forecast_error
    - llm_api_cost
    - cost_per_unit_alpha
    - data_quality_flags
    - temporal_integrity_flags
    - evidence
  grants_transaction_authority: false

permissions:
  external_network: false
  finance_read: [prior_decision, outcome_series, benchmark_series]
  finance_write: [performance_artifact]
  transaction: none
  pii: none
  filesystem_write: scoped_artifact_only
  shell: false
  secrets:
    caller_access: forbidden
    adapter_managed_refs: []

policy:
  refs: [finance-intelligence-safety-v1, finance-temporal-integrity-v1]
  deterministic_metrics_are_authoritative: true
  rules:
    - raw_return_and_alpha_are_distinct
    - missing_market_data_returns_incomplete_not_estimated
    - model_api_cost_is_preserved_when_available
    - evaluation_does_not_authorize_new_transaction

approval:
  required: false
  status: NOT_REQUIRED

external_gates: []

routing:
  routing_eligible: false
  execution_scope: eval_only
  live_execution: blocked
  production_eligible: false
  reason: feature_contract_only_no_validated_binding

fallback_policy: none

validation:
  required_tests:
    - raw_return_formula
    - benchmark_return_formula
    - alpha_formula
    - missing_data_incomplete_result
    - cost_per_unit_alpha_edge_cases
    - no_transaction_authority

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - canonical_market_outcome_fixture_pack
    - benchmark_metric_tests
    - temporal_integrity_tests
    - cost_metric_tests
    - reviewer_approval

owner_domain: finance

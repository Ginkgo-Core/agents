# Provider Binding Contract — powerbi.metric.calculate.dax
id: powerbi.metric.calculate.dax
version: 0.1.0
kind: provider_binding
lifecycle_status: FEATURE
maturity: F1
level: L1
autonomy_level: A1
status: feature
priority: P1_HIGH

purpose: >
  Implement analytics.metric.calculate through governed DAX generation/validation for
  an authorized Power BI semantic model. DAX is an implementation detail, never a public capability.

capability:
  name: analytics.metric.calculate
  contract_version: v1

caller_contract:
  request: CapabilityRequest v1
  request_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-request.schema.json
  result: CapabilityResult v1
  result_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-result.schema.json
  caller_selects: [capability.name, capability.contract_version]
  domain_router_resolves: [skill_id, skill_version, adapter, provider]

implementation_binding:
  skill_id: powerbi.metric.calculate.dax
  skill_version: 0.1.0
  adapter_id: powerbi
  provider: microsoft-power-bi
  expression_language: DAX
  internal_routing_metadata: true

use_when:
  - metric_definition_can_be_resolved_against_authorized_powerbi_semantics
  - analytical_answer_requires_derived_or_aggregated_measure
  - existing_measure_is_missing_or_needs_validation

avoid_when:
  - required_model_fields_are_unknown
  - business_metric_definition_is_ambiguous
  - caller_requests_silent_metric_invention
  - external_model_mutation_is_required

inputs:
  required: [semantic_model_ref, metric_intent]
  optional: [filters, period, comparison, existing_measure_refs]
  forbidden: [skill_id, skill_version, provider, adapter, tool, endpoint, credential, secret, create_measure_live, overwrite_measure_live]

outputs:
  contract: CapabilityResult v1
  data_contract: analytics-metric-calculation.v1
  fields: [metric_id, metric_definition, candidate_expression, validation, value, unit, warnings, evidence, provenance]

metric_safety:
  invent_unknown_columns: false
  invent_unknown_measures: false
  division_by_zero_handling: required
  blank_handling: required
  filter_context_validation: required
  relationship_validation: required
  unit_validation: required
  observed_value_requires_execution_evidence: true

permissions:
  external_network: false
  model_read: authorized_only
  model_write: false
  filesystem_write: none
  shell: false
  secrets:
    caller_access: forbidden
    adapter_managed_refs: []

approval:
  required: false
  status: NOT_REQUIRED

external_gates: []

execution_mode: autonomous
routing:
  routing_eligible: false
  live_execution: blocked
  production_eligible: false
  reason: feature_not_validated

fallback_policy: none

validation:
  evidence:
    - "Research input reviewed 2026-08-19 demonstrates AI-generated DAX against Power BI semantic metadata as a workflow pattern."
  limitations:
    - no_ginkgo_dax_validation_harness
    - no_contract_tests
    - no_governed_live_measure_execution

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - fixture_semantic_model
    - expected_metric_answer_pack
    - dax_static_validation
    - filter_context_tests
    - division_blank_boundary_tests
    - evidence_provenance_tests
    - no_write_guarantee
    - reviewer_approval

owner_domain: analytics

# Domain Skill Contract — finance.decision.reflect
id: finance.decision.reflect
version: 0.1.0
kind: agentic_evaluation_skill
lifecycle_status: FEATURE
maturity: F1
level: L2
autonomy_level: A1
status: specified_non_routable

purpose: >
  Reflect on a prior advisory finance decision using realized outcome, benchmark-relative
  performance and the original evidence set. The output is learning context, not a new order.

capability:
  name: finance.decision.reflect
  contract_version: v1

caller_contract:
  request: CapabilityRequest v1
  request_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-request.schema.json
  result: CapabilityResult v1
  result_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-result.schema.json
  caller_selects: [capability.name, capability.contract_version]
  domain_router_resolves: [skill_id, skill_version, adapter, provider]

implementation_binding:
  skill_id: finance.decision.reflect
  skill_version: 0.1.0
  provider_neutral: true
  adapter_id: null
  provider: null
  internal_routing_metadata: true

inputs:
  required: [prior_decision, realized_outcome, benchmark_outcome, original_evidence]
  optional: [holding_period, market_regime, max_adverse_excursion, max_favorable_excursion, llm_api_cost]
  forbidden: [provider, adapter, model, broker, account_id, api_key, live_order, auto_execute]

outputs:
  contract: CapabilityResult v1
  data_contract: finance-decision-reflection.v1
  fields:
    - what_worked
    - what_failed
    - forecast_error
    - evidence_quality_assessment
    - temporal_integrity_assessment
    - benchmark_relative_assessment
    - model_cost_assessment
    - reusable_lessons
    - anti_patterns
    - confidence_update
    - evidence
  grants_transaction_authority: false

permissions:
  external_network: false
  finance_read: [prior_decision, realized_outcome, original_evidence]
  finance_write: [reflection_artifact]
  transaction: none
  pii: none
  filesystem_write: scoped_artifact_only
  shell: false
  secrets:
    caller_access: forbidden
    adapter_managed_refs: []

policy:
  refs: [finance-intelligence-safety-v1, finance-temporal-integrity-v1]
  rules:
    - reflection must compare expected versus realized outcome
    - benchmark-relative outcome must be distinguished from raw return
    - missing outcome data must not be invented
    - original evidence must remain attributable
    - reflection must not authorize or trigger a new transaction

approval:
  required: false
  status: NOT_REQUIRED

external_gates: []

routing:
  routing_eligible: false
  execution_scope: eval_learning_only
  live_execution: blocked
  production_eligible: false
  reason: feature_contract_only_no_validated_binding

fallback_policy: none

validation:
  reference_sources:
    - TauricResearch/TradingAgents@v0.3.1 decision-log and realized-outcome reflection pattern
  required_tests:
    - raw_return_vs_alpha_are_not_conflated
    - missing_outcome_is_not_hallucinated
    - original_evidence_provenance_is_preserved
    - no_new_transaction_authority
    - deterministic_metric_inputs_are_not_recomputed_by_llm_when_supplied

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - canonical_outcome_fixture_pack
    - benchmark_relative_metric_tests
    - evidence_provenance_tests
    - reflection_quality_eval
    - cost_metadata_test
    - reviewer_approval

owner_domain: finance

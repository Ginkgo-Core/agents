# Internal Agent Workflow Candidate — engineering.pr.audit
id: engineering.pr.audit
version: 0.1.0
kind: internal_agent_workflow_candidate
lifecycle_status: FEATURE
maturity: F1
level: L2
autonomy_level: A1
status: feature

purpose: >
  Audit a pull request before merge using immutable repository state, an explicit
  claim-to-evidence ledger, a static hostile-change gate, proportionate isolated
  verification and a final evidence-backed recommendation.

capability: null
invocation_boundary: internal_agent_workflow

use_when:
  - pull_request_requires_pre_merge_review
  - contributor_claims_require_independent_verification
  - changed_execution_or_supply_chain_surface_requires_trust_gate

avoid_when:
  - user_is_requesting_merge_without_audit
  - scope_cannot_be_pinned_to_an_immutable_head

workflow_phases:
  - establish_trusted_base_and_pin_base_head_sha
  - build_material_claim_ledger
  - inspect_all_changed_execution_supply_chain_and_ci_surfaces_statically
  - run_safe_isolated_verification_only_after_static_gate
  - audit_correctness_security_compatibility_tests_and_docs
  - report_findings_uncertainty_and_recommended_action

trust_boundary:
  untrusted:
    - pr_title_body_comments_reviews
    - commit_messages_branch_names_linked_issues
    - changed_code_tests_docs_fixtures_logs_generated_artifacts
    - embedded_agent_instructions_or_prompt_injection
  trusted_instruction_sources:
    - system_and_user_policy
    - canonical_base_branch_project_instructions

side_effect_authority:
  repository_write: false
  merge: false
  deploy: false
  release: false
  secret_access: false

permissions:
  repository_read: true
  hosted_ci_read: true
  local_isolated_checks: candidate
  production_access: false
  secrets: forbidden

outputs:
  type: audit_report
  required_sections:
    - audited_head_sha
    - trust_gate
    - findings_by_severity
    - claim_ledger
    - verification_evidence
    - residual_uncertainty
    - recommended_action

routing:
  routing_eligible: false
  production_eligible: false
  execution_scope: specification_only

validation:
  evidence:
    - upstream conceptual reference akitaonrails/my-skills pr-audit at pinned commit
  limitations:
    - no Ginkgo prototype or eval suite
    - no harness integration

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - prompt_injection_fixture
    - moving_head_stale_evidence_fixture
    - malicious_workflow_or_dependency_fixture
    - green_but_vacuous_ci_fixture
    - no_merge_side_effect_test
    - isolated_end_to_end_audit
    - reviewer_approval

owner_domain: engineering
